# The main pipeline for gold_layer_production

resources:
  pipelines:
    gold_layer_production_etl:
      name: gold_layer_production_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/gold_layer_production_etl"

      libraries:
        - glob:
            include: ../src/gold_layer_production_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
