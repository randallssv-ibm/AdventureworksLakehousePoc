# This is a Databricks asset bundle definition for gold_layer_commercial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: gold_layer_commercial
  uuid: 8a8cd424-ca34-4582-b916-ccaf33306084

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405607848397610.10.azuredatabricks.net
    variables:
      catalog: commercialgold
      schema: sales
  prod:
    mode: production
    workspace:
      host: https://adb-7405607848397610.10.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/randall.suarez@ibmconsultinghakkoda.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/randall.suarez@ibmconsultinghakkoda.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: commercialgold
      schema: sales
    permissions:
      - user_name: randall.suarez@ibmconsultinghakkoda.onmicrosoft.com
        level: CAN_MANAGE
