# The main pipeline for gold_layer_commercial

resources:
  pipelines:
    gold_layer_commercial_etl:
      name: gold_layer_commercial_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/gold_layer_commercial_etl"

      libraries:
        - glob:
            include: ../src/gold_layer_commercial_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
