# The main pipeline for CommercialSilver

resources:
  pipelines:
    CommercialSilver:
      name: CommercialSilver
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true

      libraries:
        - glob:
            include: src/CommercialSilver/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
